# Tiny model for CPU smoke tests and pipeline debugging. Not for real voices.
audio:
  sample_rate: 22050
  filter_length: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80

model:
  inter_channels: 16
  hidden_channels: 16
  filter_channels: 32
  n_heads: 2
  n_layers: 2
  p_dropout: 0.0
  resblock_kernel_sizes: [3]
  resblock_dilation_sizes: [[1, 3]]
  upsample_rates: [8, 8, 2, 2]
  upsample_initial_channel: 32
  upsample_kernel_sizes: [16, 16, 4, 4]
  posterior_layers: 2
  flow_layers: 2
  n_flows: 2
  dp_filter_channels: 16

train:
  batch_size: 2
  segment_size: 2048
  precision: fp32
  num_workers: 0
  log_interval: 1
  eval_interval: 1000000
  checkpoint_interval: 2
  keep_checkpoints: 2
  eval_texts: ["வணக்கம் hello"]
