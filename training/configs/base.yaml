# Kural-VITS full model (~36M params generator), 22.05 kHz. Use on Colab L4/A100.
data:
  train_manifest: data/manifests/train.jsonl
  val_manifest: data/manifests/val.jsonl
  audio_root: .
  max_seconds: 15.0

audio:
  sample_rate: 22050
  filter_length: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80

model:
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0.1
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  upsample_rates: [8, 8, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [16, 16, 4, 4]
  posterior_layers: 16
  flow_layers: 4
  n_flows: 4
  dp_filter_channels: 256

train:
  batch_size: 16          # A100 40GB: 32; T4: 8
  learning_rate: 2.0e-4
  lr_decay: 0.999875
  segment_size: 8192
  c_mel: 45.0
  c_kl: 1.0
  precision: auto         # bf16 on Ampere+, fp16 on T4, fp32 on CPU
  num_workers: 2
  log_interval: 100
  eval_interval: 2000
  checkpoint_interval: 2000
  keep_checkpoints: 3
