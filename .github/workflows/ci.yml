name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Install wheel in a clean env and run the CLI
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/kural-tts --version
          # Exercises packaged data (Tanglish lexicon) from the installed wheel.
          /tmp/clean/bin/kural-tts "vanakkam, naan 10 mani ku varen" --normalize
          # Exercises the packaged CMUdict lexicon and the full G2P path.
          /tmp/clean/bin/kural-tts "Your OTP for Velachery-la order is 4521" --phonemes
      - name: Runtime dependency license check (no GPL in the shipped package)
        run: |
          uv pip install --python /tmp/clean pip-licenses
          /tmp/clean/bin/pip-licenses --packages numpy soundfile onnxruntime huggingface-hub --fail-on="GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2)"

  training-and-integrations:
    # Model, training smoke test, ONNX export/runtime, data pipeline, server and LiveKit plugin.
    # CPU-only PyTorch keeps the job small; no GPU is needed for the tiny test model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and training/integration dependencies
        run: |
          uv venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e . librosa pyloudnorm pyyaml tensorboard onnx \
            pytest fastapi httpx "livekit-agents>=1.0"
      - run: .venv/bin/python -m pytest
